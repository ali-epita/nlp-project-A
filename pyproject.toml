[project]
name = "finrag"
version = "0.1.0"
description = "Retrieval-Augmented Generation over FinanceBench: corpus pipeline, retrieval experiments, local generation, and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "requests>=2.32",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
finrag = "finrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
